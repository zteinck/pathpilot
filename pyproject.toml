[project]
name = "pathpilot"
version = "0.8.0"
description = "Simplifies file and folder manipulation"
authors = [
    { name = "Zachary Einck", email = "zacharyeinck@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cachegrab>=0.2.4",
    "clockwork>=0.7.1",
    "fastexcel>=0.21.0",
    "numpy>=2.5.4",
    "oddments>=0.10.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "xlsxwriter>=3.2.9",
]

[project.urls]
repository = "https://github.com/zteinck/pathpilot"
homepage = "https://github.com/zteinck/pathpilot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
